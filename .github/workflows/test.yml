# Path:     .github/workflows/test.yml
# Project:  revisualized.com public repositories (github.com/revisualize)
# Revision: 1
# Updated:  2026-09-29
#
# Purpose:  Runs the repository's test suite and reports it on its own "test"
#           badge. Byte-identical in every repository that carries it. The
#           suite is declared in test/run_all_tests.sh, the same command a
#           reader runs locally:
#
#               bash test/run_all_tests.sh;
#
# Contract: Identical to the test job in ci.yml Revision 9:
#           1. test/run_all_tests.sh must exist, or the run fails.
#           2. The harness exits 0 only when every suite passed.
#           3. Each suite appends "<label><TAB><count>" to TESTS_EXECUTED_FILE.
#              A missing, malformed, or zero total fails the run, so a harness
#              that ran nothing cannot report success.
#           The job summary lists every suite and its test count.
#
# Matrix:   Python 3.9 (the oldest version any repository claims) and 3.12,
#           on ubuntu-24.04, the environment ci.yml was verified against.

name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install bats when the repository has bats suites
        run: |
          set -euo pipefail;
          if [ -n "$(find . -name '*.bats' -type f -not -path './.git/*' -print -quit)" ]; then
            sudo apt-get update -q;
            sudo apt-get install -y -q bats;
            bats --version;
          else
            echo "No .bats files. bats not installed.";
          fi;

      - name: Install declared Python dependencies
        run: |
          set -euo pipefail;
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt;
          else
            echo "No requirements.txt. Standard library only.";
          fi;

      - name: Byte-compile every Python module outside test fixtures
        run: |
          set -euo pipefail;
          mapfile -d '' python_files < <(find . -name '*.py' -type f \
            -not -path './.git/*' -not -path '*/test/fixtures/*' -print0 | sort -z);
          if [ "${#python_files[@]}" -eq 0 ]; then
            echo "No Python modules. Nothing to compile.";
            exit 0;
          fi;
          python -m py_compile "${python_files[@]}";
          echo "Compiled ${#python_files[@]} modules under $(python --version).";

      - name: Run the declared test entry point
        env:
          TESTS_EXECUTED_FILE: ${{ runner.temp }}/tests_executed.tsv
        run: |
          set -euo pipefail;
          if [ ! -f test/run_all_tests.sh ]; then
            echo "::error title=No tests declared::test/run_all_tests.sh is missing. This workflow does not report success for a repository that declares no tests.";
            exit 1;
          fi;
          bash test/run_all_tests.sh;

      - name: Require that tests actually ran
        env:
          TESTS_EXECUTED_FILE: ${{ runner.temp }}/tests_executed.tsv
        run: |
          set -euo pipefail;
          if [ ! -s "${TESTS_EXECUTED_FILE}" ]; then
            echo "::error title=No test count reported::The harness exited 0 but reported no executed tests. A pass that ran nothing is not a pass.";
            exit 1;
          fi;
          {
            echo "### Tests executed, Python ${{ matrix.python-version }}";
            echo "";
            echo "| Suite | Count |";
            echo "|---|---|";
          } >> "${GITHUB_STEP_SUMMARY}";
          awk -F '\t' -v summary="${GITHUB_STEP_SUMMARY}" '
            NF != 2 || $2 !~ /^[0-9]+$/ { malformed = 1; print "malformed line " NR ": " $0; next; }
            { total += $2; printf "%-50s %s\n", $1, $2; printf "| %s | %s |\n", $1, $2 >> summary; }
            END {
              printf "| **Total** | **%d** |\n", total >> summary;
              if (malformed) { print "::error title=Malformed test count::see the lines above"; exit 1; }
              if (total == 0) { print "::error title=Zero tests executed::every suite reported a count of zero"; exit 1; }
              printf "Total tests executed: %d\n", total;
            }' "${TESTS_EXECUTED_FILE}";
