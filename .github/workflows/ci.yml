# Path:     .github/workflows/ci.yml
# Project:  revisualized.com public repositories (github.com/revisualize)
# Revision: 8
# Updated:  2026-09-26
#
# Purpose:  One workflow, byte-identical in every repository that carries it.
#           It knows nothing about any single repository. Each repository
#           declares its own tests in test/run_all_tests.sh, which is the same
#           command a reader runs locally:
#
#               bash test/run_all_tests.sh;
#
# Contract: 1. test/run_all_tests.sh must exist. A repository that declares
#              no tests fails. It is not reported as passing.
#           2. The harness exits 0 only when every suite it runs has passed.
#           3. For each suite, the harness appends a line
#              "<label><TAB><count>" to the file named by TESTS_EXECUTED_FILE.
#              The build fails if that file is missing, malformed, or totals
#              zero, so a harness that ran nothing cannot report success.
#              This catches an accidental zero. It cannot catch a harness
#              that misreports its own count. Negative controls inside the
#              harnesses are what test the tests.
#
#           Shell files under any test/fixtures/ directory are test data and
#           are not linted, because a fixture may be hazardous on purpose.
#
# Pins:     ubuntu-24.04 rather than ubuntu-latest, so the environment a
#           launched repository was verified against does not change under
#           it. Python 3.9 is not published for Ubuntu 26.04 in the
#           actions/python-versions manifest (checked 2026-09-26), so a
#           moving label would eventually break the 3.9 leg.
#           Python 3.9 is the oldest version any repository claims. 3.12
#           adds a current release, and its unittest exits 5 when no test
#           ran, which 3.9 does not.
#
# Revision 8 replaces Revisions 4 through 7. Those revisions detected each
# language and skipped cleanly when a suite was absent, so a repository with
# no tests reported the same success as one with fifty, and the negative
# control job named files from three unrelated repositories.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        run: |
          sudo apt-get update -q;
          sudo apt-get install -y -q shellcheck;
          shellcheck --version;

      - name: Static analysis of every shell script outside test fixtures
        run: |
          set -euo pipefail;
          mapfile -d '' shell_files < <(find . -name '*.sh' -type f \
            -not -path './.git/*' -not -path '*/test/fixtures/*' -print0 | sort -z);
          if [ "${#shell_files[@]}" -eq 0 ]; then
            echo "No shell scripts outside test/fixtures/. Nothing to lint.";
            echo "shellcheck: no shell scripts to lint" >> "${GITHUB_STEP_SUMMARY}";
            exit 0;
          fi;
          printf 'Linting %s\n' "${shell_files[@]}";
          shellcheck --severity=style "${shell_files[@]}";
          echo "shellcheck: ${#shell_files[@]} files, no findings" >> "${GITHUB_STEP_SUMMARY}";

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install bats when the repository has bats suites
        run: |
          set -euo pipefail;
          if [ -n "$(find . -name '*.bats' -type f -not -path './.git/*' -print -quit)" ]; then
            sudo apt-get update -q;
            sudo apt-get install -y -q bats;
            bats --version;
          else
            echo "No .bats files. bats not installed.";
          fi;

      - name: Install declared Python dependencies
        run: |
          set -euo pipefail;
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt;
          else
            echo "No requirements.txt. Standard library only.";
          fi;

      - name: Byte-compile every Python module outside test fixtures
        run: |
          set -euo pipefail;
          mapfile -d '' python_files < <(find . -name '*.py' -type f \
            -not -path './.git/*' -not -path '*/test/fixtures/*' -print0 | sort -z);
          if [ "${#python_files[@]}" -eq 0 ]; then
            echo "No Python modules. Nothing to compile.";
            exit 0;
          fi;
          python -m py_compile "${python_files[@]}";
          echo "Compiled ${#python_files[@]} modules under $(python --version).";

      - name: Run the declared test entry point
        env:
          TESTS_EXECUTED_FILE: ${{ runner.temp }}/tests_executed.tsv
        run: |
          set -euo pipefail;
          if [ ! -f test/run_all_tests.sh ]; then
            echo "::error title=No tests declared::test/run_all_tests.sh is missing. This workflow does not report success for a repository that declares no tests.";
            exit 1;
          fi;
          bash test/run_all_tests.sh;

      - name: Require that tests actually ran
        env:
          TESTS_EXECUTED_FILE: ${{ runner.temp }}/tests_executed.tsv
        run: |
          set -euo pipefail;
          if [ ! -s "${TESTS_EXECUTED_FILE}" ]; then
            echo "::error title=No test count reported::The harness exited 0 but reported no executed tests. A pass that ran nothing is not a pass.";
            exit 1;
          fi;
          {
            echo "### Tests executed, Python ${{ matrix.python-version }}";
            echo "";
            echo "| Suite | Count |";
            echo "|---|---|";
          } >> "${GITHUB_STEP_SUMMARY}";
          awk -F '\t' -v summary="${GITHUB_STEP_SUMMARY}" '
            NF != 2 || $2 !~ /^[0-9]+$/ { malformed = 1; print "malformed line " NR ": " $0; next; }
            { total += $2; printf "%-50s %s\n", $1, $2; printf "| %s | %s |\n", $1, $2 >> summary; }
            END {
              printf "| **Total** | **%d** |\n", total >> summary;
              if (malformed) { print "::error title=Malformed test count::see the lines above"; exit 1; }
              if (total == 0) { print "::error title=Zero tests executed::every suite reported a count of zero"; exit 1; }
              printf "Total tests executed: %d\n", total;
            }' "${TESTS_EXECUTED_FILE}";
